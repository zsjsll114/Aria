[package]
name = "aria-player"
version = "1.0.0"
description = "Aria"
authors = ["you"]
edition = "2021"

[lib]
name = "lyrics_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
