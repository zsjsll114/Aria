[package]
name = "aria-player"
version = "2.1.0"
description = "Aria"
authors = ["you"]
edition = "2021"

[lib]
name = "lyrics_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 原生音频引擎（WASAPI 共享/独占 + 解码 + EQ）。
# ★ path 依赖而不是 crates.io：这个 crate 只服务本项目，且刻意不依赖 Tauri
#   （见其 Cargo.toml 顶部注释——独立才能用 audio-probe 脱离 WebView2 验证）。
aria-audio = { path = "audio" }

# 绿色版体积：默认 release 档（opt-level=3 / codegen-units=16 / 无 LTO）产出 96MB 的 Aria.exe。
# 下面四项只改编译方式，不改任何行为。panic 刻意沿用默认 unwind —— tokio 靠 unwind 把
# 单个任务 panic 隔离掉，写 abort 会让一次崩溃直接带走整个播放器（那是功能退化，不是瘦身）。
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
