name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install devDependencies (eslint/prettier)
        run: npm ci
      - name: ESLint (only hard errors block; warnings are tracked debt)
        run: npm run lint

  pv-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Start local server (python server.py :8001)
        run: |
          python server.py > server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8001/index.html > /dev/null 2>&1; then
              echo "server up on :8001"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start, log:"; tail -50 server.log; exit 1

      # ★ 跑整个 glob，不是一行行手抄：手抄的名单会让「新写的测试没登记」静默变成绿色 CI。
      #   新增 tests/js/test_*.js 自动进门禁，无需改这个文件。
      - name: Run JS unit tests (all of tests/js/test_*.js)
        run: node --test tests/js/test_*.js

      - name: Motion discipline ratchet (easing curves / bounce / transition:all / will-change)
        run: node scripts/audits/motion-audit.mjs --check

      - name: i18n phrase-registry ratchet (中文 UI 文本必须登记进 STATIC_PHRASE_MAP)
        run: node scripts/audits/i18n-coverage.mjs --check

      - name: Resolve instrumentation gate (每个 playUrl 赋值点必须埋 recordResolveHit)
        run: node scripts/audits/resolve-instrumentation.mjs --check

      - name: Resolve instrumentation gate self-test (门禁本身必须会响)
        run: node --test tests/js/test_resolve_instrumentation.js

      # ★ 新增测试文件不得「写了但没进 CI」（本仓库真漏过 15 个，全靠人肉发现）
      - name: Test registry gate (每个 tests/**/test_*.?(js|py) 必须在 ci.yml 里跑到)
        run: node scripts/audits/test-registry.mjs --check

      - name: Run Python unit tests (audio stream proxy / MIME)
        run: |
          python -m unittest tests.python.test_audio_stream
          python -m unittest tests.python.test_vosk_model_path
          python -m unittest tests.python.test_vendor_loopback_guard
          python -m unittest tests.python.test_cache_lock
          python -m unittest tests.python.test_kugou_cellphone
          python -m unittest tests.python.test_verify_login

      - name: Run PV regression tests
        run: |
          python tests/test_pv_handoff.py
          python tests/test_pv_scene_group.py
          python tests/test_pv_geo_mosaic.py

      - name: Settings panel regression smoke
        run: |
          python tests/test_settings_smoke.py
          python tests/test_word_fallback.py
          python tests/test_word_align.py

      # 2026-09-26 这批修复各自的回归钉：默认模式入口/取链音源判定/日推点击/数字步进器
      - name: Cover-mode entries, source routing, daily-recommend & stepper smoke
        run: |
          python tests/test_cover_mode_entries.py
          python tests/test_source_routing.py
          python tests/test_daily_recommend_click.py
          python tests/test_number_stepper.py
          python tests/test_titlebar_contrast.py
          python tests/test_theme_palette_ui.py
          python tests/test_word_per_char_ui.py
          python tests/test_ab_loop_ui.py
          # 2026-09-26 AI 反代隐私确认：开机无手势不得弹窗（本机未走反代时整体 SKIP）
          python tests/test_ai_privacy_boot.py
          # 2026-09-26 首跑向导：标准毛玻璃 + 英文模式真的翻译 + 主题色写全两个变量
          python tests/test_oobe_settings_polish.py
          # 这两份早就写好且本地全绿（49/49、33/33），一直没进 CI —— 正是登记门禁要挡的情形
          python tests/test_toolbar_customization.py
          python tests/test_phone_remote.py
          python tests/test_vfx_intensity_ui.py
          python tests/test_zen_mode_ui.py